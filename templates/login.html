{% extends "base.html" %} {% block titulo %}Login - Controle de Tarefas{%
endblock %} {% block conteudo %}
<section class="card estreito">
  <h1>Controle de Tarefas</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}" />
    <label
      >Usuário <input name="nome" required autofocus maxlength="50"
    /></label>
    <label>Senha <input name="senha" type="password" required /></label>
    <button class="primario">Entrar</button>
  </form>
</section>
{% endblock %}
